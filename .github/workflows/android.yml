name: CI - Check Code Quality

on:
  push:
    branches: [ threed]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint code (optional but recommended)
      - name: Run ESLint
        run: npm run lint || echo "No lint script found"

      # 5️⃣ Run tests (this is what actually checks if code works)
      - name: Run tests
        run: npm test || echo "No tests found"

      # 6️⃣ Build project (important for React/Node apps)
      - name: Build project
        run: npm run build || echo "No build step defined"
